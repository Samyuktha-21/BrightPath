<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightPath — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Sticky header with 3px teal top bar -->
    <header class="site-header">
        <div class="header-accent"></div>
        <nav class="navbar">
            <a href="index.html" class="brand">Bright<span>Path</span></a>
            <div class="nav-actions" id="nav-actions">
                <a href="calendar.html" class="btn-ghost">Calendar</a>
                <a href="community.html" class="btn-ghost">Community</a>
                <a href="login.html" class="cta-button" id="login-btn">Login</a>
            </div>
        </nav>
    </header>

    <main class="page">
        <!-- Personalised greeting (shown when logged in) -->
        <section class="greeting" id="greeting-section" style="display: none;">
            <h1 id="user-greeting"></h1>
            <p>Here are the exams you're tracking and what's coming up.</p>
        </section>

        <!-- Recent info — slow scrolling ticker -->
        <div class="announce-viewport">
            <div class="announce-track" id="announcements"></div>
        </div>

        <!-- Analytics (shown when logged in) -->
        <div id="analytics-dashboard" class="analytics-dashboard" style="display: none;"></div>

        <!-- Search + filters -->
        <div class="controls">
            <div class="search-wrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" class="search-bar" placeholder="Search exams, bodies, categories…">
            </div>
            <div class="filter-row no-scrollbar" id="category-filters">
                <button class="filter-chip active" data-category="All">All</button>
                <button class="filter-chip" data-category="Engineering">Engineering</button>
                <button class="filter-chip" data-category="Medical">Medical</button>
                <button class="filter-chip" data-category="Government">Government</button>
                <button class="filter-chip" data-category="Management">Management</button>
                <button class="filter-chip" data-category="School">School</button>
                <button class="filter-chip" data-category="Law">Law</button>
                <button class="filter-chip" data-category="Design">Design</button>
                <button class="filter-chip" data-category="Language">Language</button>
                <button class="filter-chip" data-category="Saved">★ Saved</button>
            </div>
        </div>

        <!-- Last updated line -->
        <div class="last-updated" id="last-updated">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.81 1 6.5 2.6"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
            <span id="last-updated-text">Checking for updates…</span>
        </div>

        <!-- Exam cards -->
        <div id="exams-grid" class="exams-grid"></div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 BrightPath — track every exam that matters.</p>
        <div class="links">
            <a href="about.html">About</a>
            <a href="disclaimer.html">Disclaimer</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>

    <script src="dashboard.js"></script>
</body>

</html>
